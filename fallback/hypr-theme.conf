# SAFE FALLBACK THEME
# Seeded by hyprland-setup when the separate themes repo has not generated one yet.
# The `theme <name>` command may replace this file later.

$bg = rgb(1e1e2e)
$bg_alt = rgb(181825)
$fg = rgb(cdd6f4)
$fg_dim = rgb(a6adc8)
$accent = rgb(cba6f7)
$accent2 = rgb(89b4fa)
$urgent = rgb(f38ba8)

# Group colors for tabbed/grouped windows
$group_active = rgba(cba6f7ff)
$group_inactive = rgba(313244aa)
$group_locked = rgba(f38ba8ff)
$group_text = rgb(cdd6f4)

general {
    border_size = 2
    gaps_in = 4
    gaps_out = 8
    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(313244aa)
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false
    dim_strength = 0.0
    blur {
        enabled = false
        size = 8
        passes = 1
        new_optimizations = true
        xray = false
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = windowsIn, 1, 5, ease, popin 60%
    animation = windowsOut, 1, 4, ease, popin 60%
    animation = windowsMove, 1, 4, ease, slide
    animation = fade, 1, 4, ease
    animation = workspaces, 1, 4, ease, slide
    animation = border, 1, 6, ease
}
