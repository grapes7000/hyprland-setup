# ─────────────────────────────────────────────────────────────
#  Hyprland — modular config.  Look/colors come from the theme
#  system: run `theme <name>`.  Do not edit generated/ by hand.
# ─────────────────────────────────────────────────────────────
source = ~/.config/hypr/conf/env.conf
source = ~/.config/hypr/conf/cursor.conf
source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/defaults.conf       # safe variable defaults
source = ~/.config/hypr/generated/theme.conf     # colors + decoration (generated)
source = ~/.config/hypr/conf/behavior.conf
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/keybinds.conf
source = ~/.config/hypr/conf/windowrules.conf
source = ~/.config/hypr/conf/autostart.conf
