# AUTO-GENERATED by `theme`. Edit hypr/themes/<name>.json instead.
$bg = rgb(282828)
$bg_alt = rgb(1d2021)
$fg = rgb(ebdbb2)
$fg_dim = rgb(a89984)
$accent = rgb(fabd2f)
$accent2 = rgb(fe8019)
$urgent = rgb(fb4934)

general {
    border_size = 1
    gaps_in = 8
    gaps_out = 16
    col.active_border = rgba(fabd2fff) rgba(fe8019ff) 45deg
    col.inactive_border = rgba(3c3836aa)
}

decoration {
    rounding = 20
    rounding_power = 1.5
    active_opacity = 0.83
    inactive_opacity = 0.71
    dim_inactive = true
    dim_strength = 0.06
    blur {
        enabled = true
        size = 16
        passes = 4
        noise = 0.02
        contrast = 0.75
        brightness = 0.72
        vibrancy = 0.1
        new_optimizations = true
        xray = false
    }
    shadow {
        enabled = true
        range = 18
        render_power = 2
        offset = 0 4
        color = rgba(0000004c)
    }
}

layerrule {
    name = waybar-blur
    match:namespace = waybar
    blur = yes
}

layerrule {
    name = wofi-blur
    match:namespace = wofi
    blur = yes
}

layerrule {
    name = rofi-blur
    match:namespace = rofi
    blur = yes
}

animations {
    enabled = true
    bezier = spring, 0.0, 1.2, 0.3, 1.0
    bezier = springOut, 0.3, -0.3, 0.8, 1.0
    animation = windowsIn, 1, 5, spring, popin 60%
    animation = windowsOut, 1, 4, springOut, popin 60%
    animation = windowsMove, 1, 4, spring, slide
    animation = fade, 1, 4, spring
    animation = fadeDim, 1, 5, spring
    animation = fadeShadow, 1, 4, spring
    animation = workspaces, 1, 5, spring, slidefade 50%
    animation = border, 1, 6, spring
}
