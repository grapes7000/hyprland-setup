general {
    layout = dwindle
    resize_on_border = true
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true

    # Window swallowing — terminal children replace their parent tile
    enable_swallow = true
    swallow_regex = ^(kitty|Alacritty)$
    swallow_exception_regex = ^(quick-notes|wev|xev)$
}

# Animations are generated by the theme engine (theme anim <profile>).
# Do not add a static animations {} block here.

# Grouped / tabbed windows
group {
    groupbar {
        height = 18
        render_titles = true
        font_size = 10
        col.active = $group_active
        col.inactive = $group_inactive
        col.locked_active = $group_locked
        col.locked_inactive = $group_inactive
        text_color = $group_text
    }

    auto_group = false
}
