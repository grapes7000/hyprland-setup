# Window rules
# ------------
# Hyprland 0.56.0's `windowrule` parser rejected the documented static-rule
# forms, and `windowrulev2` (which works) prints a persistent deprecation
# overlay on every launch. So rules are left out for now to keep the desktop
# nag-free. To add one later, verify the exact syntax for your Hyprland version
# with:  hyprctl keyword windowrule 'float, class:^(pavucontrol)$'
# (check `hyprctl configerrors` is clean after), then add lines here.
