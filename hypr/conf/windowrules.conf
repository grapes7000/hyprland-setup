# Window rules
# ------------
# NOTE: Hyprland 0.53 overhauled windowrule syntax to a block form:
#   windowrule {
#       name = unique-id      # must be the FIRST key in the block
#       match:class = ^(regex)$
#       float = yes
#   }
# The old flat `windowrule = float, class:^(...)$` form (and windowrulev2)
# no longer parses — it throws "invalid field X: missing a value" for every
# field. `name` must come first or you get "special category's first value
# must be the key". Verify a rule for your version before adding it, then
# check `hyprctl configerrors` is clean.
#
# Opacity/blur/shadow/rounding are intentionally NOT set here — they are owned
# by the theme engine's generated `decoration {}` block (per-theme `opacity`,
# `opacity_inactive`, etc. in themes/<name>.json). Setting per-window opacity
# here would override the active theme and break `theme <name>`. Keep this file
# to layout/placement rules only so it stays theme-agnostic.

# Waybar — transparent with blur so wallpaper shows through
layerrule {
    name = waybar-blur
    match:namespace = waybar
    blur = yes
}

# Audio / volume control — floating, centered, half-size
windowrule {
    name = pavucontrol-float
    match:class = ^(pavucontrol)$

    float  = yes
    size   = 50% 50%
    center = yes
}

# Bluetooth manager
windowrule {
    name = blueman-float
    match:class = ^(blueman-manager)$

    float  = yes
    center = yes
}

# Network manager
windowrule {
    name = nm-editor-float
    match:class = ^(nm-connection-editor)$

    float  = yes
    center = yes
}

# Image viewers
windowrule {
    name = feh-float
    match:class = ^(feh)$
    float = yes
}
windowrule {
    name = imv-float
    match:class = ^(imv)$
    float = yes
}

# Media players
windowrule {
    name = mpv-float
    match:class = ^(mpv)$
    float = yes
}
windowrule {
    name = vlc-float
    match:class = ^(vlc)$
    float = yes
}

# Quick notes — persistent scratchpad
windowrule {
    name = quick-notes-float
    match:class = ^(quick-notes)$

    float  = yes
    size   = 60% 70%
    center = yes
    workspace = special:notes
}

# Auth / portal dialogs
windowrule {
    name = portal-gtk-float
    match:class = ^(xdg-desktop-portal-gtk)$
    float = yes
}
windowrule {
    name = polkit-agent-float
    match:class = ^(polkit-kde-authentication-agent-1)$

    float  = yes
    center = yes
}
