# Window rules
# Floating and layout rules for common applications

# Audio/Volume control
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = size 50% 50%, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$

# Bluetooth manager
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$

# Network manager
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = center, class:^(nm-connection-editor)$

# Image viewers - make them opaque and focused
windowrulev2 = float, class:^(feh)$
windowrulev2 = float, class:^(imv)$

# Media players - floating
windowrulev2 = float, class:^(mpv)$
windowrulev2 = float, class:^(vlc)$

# Dialog windows
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = float, class:^(polkit-kde-authentication-agent-1)$

# Opacity rules for better visual hierarchy
windowrulev2 = opacity 0.95 0.85, class:^(kitty)$
windowrulev2 = opacity 0.98 0.95, class:^(firefox)$
windowrulev2 = opacity 0.97 0.92, class:^(code)$
