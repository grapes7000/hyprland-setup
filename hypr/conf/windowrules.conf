# Window rules
# ------------
# NOTE: use the UNIFIED `windowrule` syntax with `class:^(...)$` matchers
# (NOT `windowrulev2`). On Hyprland 0.56 `windowrulev2` still works but prints a
# persistent deprecation overlay every launch — the modern `windowrule` form
# below avoids that nag. Verify a rule for your version before adding it:
#   hyprctl keyword windowrule 'float, class:^(pavucontrol)$'
# then check `hyprctl configerrors` is clean.
#
# Opacity/blur/shadow/rounding are intentionally NOT set here — they are owned
# by the theme engine's generated `decoration {}` block (per-theme `opacity`,
# `opacity_inactive`, etc. in themes/<name>.json). Setting per-window opacity
# here would override the active theme and break `theme <name>`. Keep this file
# to layout/placement rules only so it stays theme-agnostic.

# Audio / volume control — floating, centered, half-size
windowrule = float,           class:^(pavucontrol)$
windowrule = size 50% 50%,    class:^(pavucontrol)$
windowrule = center,          class:^(pavucontrol)$

# Bluetooth manager
windowrule = float,  class:^(blueman-manager)$
windowrule = center, class:^(blueman-manager)$

# Network manager
windowrule = float,  class:^(nm-connection-editor)$
windowrule = center, class:^(nm-connection-editor)$

# Image viewers
windowrule = float, class:^(feh)$
windowrule = float, class:^(imv)$

# Media players
windowrule = float, class:^(mpv)$
windowrule = float, class:^(vlc)$

# Auth / portal dialogs
windowrule = float,  class:^(xdg-desktop-portal-gtk)$
windowrule = float,  class:^(polkit-kde-authentication-agent-1)$
windowrule = center, class:^(polkit-kde-authentication-agent-1)$
