font_family      JetBrainsMono Nerd Font
font_size        12
shell            zsh
background_opacity 0.92
confirm_os_window_close 0
window_padding_width 8
enable_audio_bell no
scrollback_lines 10000
copy_on_select yes
mouse_map left click ungrabbed mouse_handle_click selection link
foreground #ebdbb2
background #1d2021
color0 #282828
color1 #cc241d
color2 #98971a
color3 #d79921
color4 #458588
color5 #b16286
color6 #689d6a
color7 #a89984
color8 #928374
color9 #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2

# theme-engine colors (managed by `theme`)
include generated/theme.conf
